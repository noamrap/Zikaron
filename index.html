        </div>

    <script>
        const COLS = 8;
        const ROWS = 4;
        const TOTAL_PIECES = COLS * ROWS; // 32

        // currentOrder[i] holds the original piece index that is currently displayed at slot i
        let currentOrder = [];
        let selectedIndex = null;
        let moves = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let isPlaying = false;
        let isWon = false;

        const boardElement = document.getElementById('puzzleBoard');
        const moveCountElement = document.getElementById('moveCount');
        const timerElement = document.getElementById('timer');
        const correctCountElement = document.getElementById('correctCount');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const previewBtn = document.getElementById('previewBtn');
        const previewModal = document.getElementById('previewModal');
        const closePreview = document.getElementById('closePreview');
        const winModal = document.getElementById('winModal');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const winStats = document.getElementById('winStats');

        // Initialize ordered array 0..31
        function initSolvedState() {
            currentOrder = Array.from({ length: TOTAL_PIECES }, (_, i) => i);
        }

        // Render the board on DOM
        function renderBoard() {
            boardElement.innerHTML = '';
            let correctPieces = 0;

            currentOrder.forEach((originalIndex, slotIndex) => {
                const pieceDiv = document.createElement('div');
                pieceDiv.classList.add('puzzle-piece');

                // Calculate background position based on original correct index
                const col = originalIndex % COLS;
                const row = Math.floor(originalIndex / COLS);
                pieceDiv.style.backgroundPosition = `${(col / (COLS - 1)) * 100}% ${(row / (ROWS - 1)) * 100}%`;

                // Check if piece is in correct place
                if (originalIndex === slotIndex) {
                    correctPieces++;
                    pieceDiv.classList.add('correct-hint');
                }

                if (selectedIndex === slotIndex) {
                    pieceDiv.classList.add('selected');
                }

                // Click event to swap pieces
                pieceDiv.addEventListener('click', () => {
                    if (isWon) return;
                    handlePieceClick(slotIndex);
                });

                boardElement.appendChild(pieceDiv);
            });

            correctCountElement.textContent = `${correctPieces} / ${TOTAL_PIECES}`;
        }

        function handlePieceClick(slotIndex) {
            if (!isPlaying) startTimer();

            if (selectedIndex === null) {
                // Select first piece
                selectedIndex = slotIndex;
                renderBoard();
            } else if (selectedIndex === slotIndex) {
                // Deselect if clicked again
                selectedIndex = null;
                renderBoard();
            } else {
                // Swap the two pieces
                const temp = currentOrder[selectedIndex];
                currentOrder[selectedIndex] = currentOrder[slotIndex];
                currentOrder[slotIndex] = temp;

                selectedIndex = null;
                moves++;
                moveCountElement.textContent = moves;

                renderBoard();

                if (checkWin()) {
                    stopTimer();
                    isWon = true;
                    showWinModal();
                }
            }
        }

        // Shuffle ensuring it's not already solved
        function shuffleBoard() {
            stopTimer();
            timerSeconds = 0;
            moves = 0;
            selectedIndex = null;
            isWon = false;
            moveCountElement.textContent = moves;
            timerElement.textContent = "00:00";
            isPlaying = false;

            initSolvedState();

            // Perform random valid swaps to shuffle
            do {
                for (let i = currentOrder.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentOrder[i], currentOrder[j]] = [currentOrder[j], currentOrder[i]];
                }
            } while (checkWin()); // repeat if accidentally solved

            renderBoard();
        }

        function checkWin() {
            for (let i = 0; i < TOTAL_PIECES; i++) {
                if (currentOrder[i] !== i) return false;
            }
            return true;
        }

        function startTimer() {
            if (isPlaying) return;
            isPlaying = true;
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const secs = (timerSeconds % 60).toString().padStart(2, '0');
                timerElement.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function showWinModal() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            winStats.textContent = `השלמת את הפאזל ב-${moves} החלפות ובזמן של ${mins > 0 ? mins + ' דקות ו-' : ''}${secs} שניות!`;
            winModal.classList.remove('hidden');
        }

        // Event listeners
        shuffleBtn.addEventListener('click', shuffleBoard);
        previewBtn.addEventListener('click', () => previewModal.classList.remove('hidden'));
        closePreview.addEventListener('click', () => previewModal.classList.add('hidden'));
        playAgainBtn.addEventListener('click', () => {
            winModal.classList.add('hidden');
            shuffleBoard();
        });

        // Initialize on load
        window.onload = () => {
            initSolvedState();
            shuffleBoard();
        };
    </script>
</body>
