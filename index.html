<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאזל תחנה - המשחק</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .game-info {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-info span {
            font-weight: bold;
            color: #818cf8;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 100%;
        }

        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 85vw;
            max-width: 360px;
            aspect-ratio: 3 / 4;
            gap: 3px;
            background: #334155;
            padding: 4px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border-color);
            position: relative;
        }

        #puzzle-board.locked::after {
            content: '🔒 הפאזל נעול! פתור את החידה';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f43f5e;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            z-index: 50;
            text-align: center;
            padding: 10px;
        }

        .puzzle-piece {
            background-image: url('Screenshot_20261010_171342_Instagram.jpg');
            background-size: 400% 300%;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        .puzzle-piece.correct-pos {
            box-shadow: inset 0 0 0 2px #4ade80, inset 0 0 15px rgba(74, 222, 128, 0.6);
            z-index: 5;
        }

        .puzzle-piece:hover {
            transform: scale(1.03);
            z-index: 10;
        }

        .puzzle-piece.selected {
            border: 2px solid #f43f5e;
            box-shadow: 0 0 15px #f43f5e;
            z-index: 20;
            transform: scale(0.96);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-card h2 {
            margin-top: 0;
            color: #818cf8;
            font-size: 1.3rem;
        }

        .riddle-text-box {
            line-height: 1.6;
            font-size: 0.95rem;
            color: #cbd5e1;
            text-align: right;
            background: #0f172a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .highlight-riddle-text {
            display: block;
            margin-top: 10px;
            padding: 8px;
            background: rgba(129, 140, 248, 0.1);
            border-right: 4px solid #818cf8;
            color: #f8fafc;
            font-weight: bold;
            font-size: 1rem;
            line-height: 1.5;
        }

        .modal-card input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .error-msg {
            color: #f43f5e;
            font-size: 0.85rem;
            margin-top: 5px;
            min-height: 20px;
        }

        .preview-toggle {
            font-size: 0.85rem;
            color: #94a3b8;
            background: none;
            border: 1px dashed var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>פאזל תחנה</h1>
    
    <div class="game-info">
        <div>צעדים: <span id="moves-count">0</span></div>
        <div>חלקים במקום: <span id="correct-count">0</span> / 12</div>
        <div>חידות: <span id="riddles-solved">0</span> / 3</div>
    </div>

    <div class="main-container">
        <div id="puzzle-board"></div>

        <div class="controls">
            <button onclick="shufflePuzzle()">ערבב מחדש</button>
        </div>
