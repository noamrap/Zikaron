
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאזל תמונה - 32 חלקים</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .game-info {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .game-info span {
            font-weight: bold;
            color: #818cf8;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 100%;
        }

        /* אזור הפאזל: 8 עמודות על 4 שורות = 32 חלקים */
        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 95vw;
            max-width: 560px;
            aspect-ratio: 2 / 1; /* יחס המותאם לתמונה מלבנית */
            gap: 2px;
            background: #334155;
            padding: 4px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border-color);
        }

        .puzzle-piece {
            background-image: url('Screenshot_20261010_171342_Instagram.jpg');
            background-size: 800% 400%; /* 8 עמודות כפול 100% ו-4 שורות כפול 100% */
            cursor: pointer;
            border-radius: 2px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .puzzle-piece:hover {
            transform: scale(1.03);
            z-index: 10;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
        }

        .puzzle-piece.selected {
            border: 2px solid #f43f5e;
            box-shadow: 0 0 15px #f43f5e;
            z-index: 20;
            transform: scale(0.96);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        /* מסך ניצחון */
        #win-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            gap: 15px;
            text-align: center;
            padding: 20px;
        }

        #win-message h2 {
            font-size: 2rem;
            color: #4ade80;
            margin: 0;
        }

        #win-message p {
            font-size: 1.1rem;
            margin: 0;
        }

        .preview-container {
            margin-top: 5px;
            text-align: center;
        }

        .preview-toggle {
            font-size: 0.85rem;
            color: #94a3b8;
            background: none;
            border: 1px dashed var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: none;
        }

        .preview-toggle:hover {
            color: #f8fafc;
            border-color: #818cf8;
            background: transparent;
        }
    </style>
</head>
<body>

    <h1>פאזל 32 חלקים</h1>
    
    <div class="game-info">
        <div>צעדים: <span id="moves-count">0</span></div>
        <div>זמן: <span id="timer">00:00</span></div>
    </div>

    <div class="main-container">
        <div id="puzzle-board"></div>

        <div class="controls">
            <button onclick="shufflePuzzle()">ערבב מחדש</button>
            <button onclick="autoSolve()" style="background: linear-gradient(135deg, #e11d48 0%, #fb7185 100%);">פתרון אוטומטי</button>
        </div>

        <div class="preview-container">
            <button class="preview-toggle" onclick="togglePreview()">הצג/הסתר תמונה מלאה</button>
            <div id="preview-box" style="display:none; margin-top:8px;">
                <img src="Screenshot_20261010_171342_Instagram.jpg" alt="תמונה מלאה" style="max-width:200px; border-radius:8px; border:1px solid var(--border-color);">
            </div>
        </div>
    </div>

    <div id="win-message">
        <h2>כל הכבוד! פתרת את הפאזל! 🎉</h2>
        <p id="win-stats"></p>
        <button onclick="shufflePuzzle(); document.getElementById('win-message').style.display='none';">שחק שוב</button>
    </div>

    <script>
        const cols = 8;
        const rows = 4;
        const totalPieces = cols * rows;
        let board = [];
        let selectedIndex = null;
        let moves = 0;
        let timerInterval = null;
        let seconds = 0;
        let gameStarted = false;

        const boardElement = document.getElementById('puzzle-board');
        const movesElement = document.getElementById('moves-count');
        const timerElement = document.getElementById('timer');

        function initGame() {
            board = Array.from({length: totalPieces}, (_, i) => i);
            shufflePuzzle();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            seconds = 0;
            timerElement.textContent = "00:00";
            gameStarted = true;
            timerInterval = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds / 60).toString().padStart(2, '0');
                let s = (seconds % 60).toString().padStart(2, '0');
                timerElement.textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            gameStarted = false;
        }

        function shufflePuzzle() {
            // ערבוב רנדומלי שמוודא שאינו פתור מראש
            do {
                for (let i = board.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [board[i], board[j]] = [board[j], board[i]];
                }
            } while (isSolved());

            moves = 0;
            movesElement.textContent = moves;
            selectedIndex = null;
            renderBoard();
            startTimer();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            board.forEach((pieceIndex, currentPos) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                if (currentPos === selectedIndex) {
                    piece.classList.add('selected');
                }

                // חישוב מיקום רקע החלק בתמונה המקורית
                const x = (pieceIndex % cols) * (100 / (cols - 1));
                const y = Math.floor(pieceIndex / cols) * (100 / (rows - 1));
                piece.style.backgroundPosition = `${x}% ${y}%`;

                piece.addEventListener('click', () => handlePieceClick(currentPos));
                boardElement.appendChild(piece);
            });
        }

        function handlePieceClick(pos) {
            if (!gameStarted) startTimer();

            if (selectedIndex === null) {
                selectedIndex = pos;
            } else if (selectedIndex === pos) {
                selectedIndex = null; // ביטוח בחירה
            } else {
                // החלפת מיקום בין החלק הנבחר לחלק הנוכחי
                [board[selectedIndex], board[pos]] = [board[pos], board[selectedIndex]];
                selectedIndex = null;
                moves++;
                movesElement.textContent = moves;

                renderBoard();

                if (isSolved()) {
                    stopTimer();
                    document.getElementById('win-stats').textContent = `סיימת ב-${moves} צעדים ובזמן של ${timerElement.textContent}!`;
                    document.getElementById('win-message').style.display = 'flex';
                }
            }
            renderBoard();
        }

        function isSolved() {
            return board.every((val, idx) => val === idx);
        }

        function autoSolve() {
            stopTimer();
            board = Array.from({length: totalPieces}, (_, i) => i);
            renderBoard();
            document.getElementById('win-stats').textContent = `הפאזל נפתר אוטומטית!`;
            document.getElementById('win-message').style.display = 'flex';
        }

        function togglePreview() {
            const box = document.getElementById('preview-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        // הפעלת המשחק בטעינה הראשונית
        initGame();
    </script>
</body>
</html>
