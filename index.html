<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאזל תחנה - המשחק</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .game-info {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .game-info span {
            font-weight: bold;
            color: #818cf8;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 100%;
        }

        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 85vw;
            max-width: 360px;
            aspect-ratio: 3 / 4;
            gap: 3px;
            background: #334155;
            padding: 4px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border-color);
            position: relative;
        }

        /* שכבת נעילה בזמן שאלה */
        #puzzle-board.locked::after {
            content: '🔒 הפאזל נעול! פתור את החידה';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f43f5e;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            z-index: 50;
            text-align: center;
            padding: 10px;
        }

        .puzzle-piece {
            background-image: url('Screenshot_20261010_171342_Instagram.jpg');
            background-size: 400% 300%;
            cursor: pointer;
            border-radius: 2px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .puzzle-piece:hover {
            transform: scale(1.03);
            z-index: 10;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
        }

        .puzzle-piece.selected {
            border: 2px solid #f43f5e;
            box-shadow: 0 0 15px #f43f5e;
            z-index: 20;
            transform: scale(0.96);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        /* פופאפ כללי (לחידות ולסיום) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-card h2 {
            margin-top: 0;
            color: #818cf8;
            font-size: 1.3rem;
        }

        .modal-card p {
            line-height: 1.6;
            font-size: 0.95rem;
            color: #cbd5e1;
            text-align: right;
            background: #0f172a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* עיצוב בולט ומודגש לשורה המיוחדת בחידה 1 */
        .highlight-riddle-text {
            display: block;
            margin-top: 10px;
            padding: 8px;
            background: rgba(129, 140, 248, 0.1);
            border-right: 4px solid #818cf8;
            color: #f8fafc;
            font-weight: bold;
            font-size: 1rem;
            line-height: 1.5;
        }

        .modal-card input {
            width: 100%;
            padding: 10px;
            margin: 15px 0 10px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .error-msg {
            color: #f43f5e;
            font-size: 0.85rem;
            margin-top: 5px;
            min-height: 20px;
        }

        .preview-container {
            margin-top: 5px;
            text-align: center;
        }

        .preview-toggle {
            font-size: 0.85rem;
            color: #94a3b8;
            background: none;
            border: 1px dashed var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <h1>פאזל תחנה</h1>
    
    <div class="game-info">
        <div>צעדים: <span id="moves-count">0</span></div>
        <div>חידות שפתרת: <span id="riddles-solved">0</span> / 6</div>
    </div>

    <div class="main-container">
        <div id="puzzle-board"></div>

        <div class="controls">
            <button onclick="shufflePuzzle()">ערבב מחדש</button>
        </div>

        <div class="preview-container">
            <button class="preview-toggle" onclick="togglePreview()">הצג/הסתר תמונה מלאה</button>
            <div id="preview-box" style="display:none; margin-top:8px;">
                <img src="Screenshot_20261010_171342_Instagram.jpg" alt="תמונה מלאה" style="max-width:160px; border-radius:8px; border:1px solid var(--border-color);">
            </div>
        </div>
    </div>

    <!-- פופאפ חידות -->
    <div id="riddle-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="riddle-title">חידה נעולה!</h2>
            <div id="riddle-content-box"></div>
            <input type="text" id="riddle-answer" placeholder="הכנס את התשובה כאן...">
            <button onclick="checkRiddleAnswer()">שלח תשובה</button>
            <div id="riddle-error" class="error-msg"></div>
        </div>
    </div>

    <!-- פופאפ סיום ניצחון -->
    <div id="win-modal" class="modal-overlay">
        <div class="modal-card" style="border-color: #4ade80;">
            <h2 style="color: #4ade80; font-size: 1.8rem;">🎉 כל הכבוד!</h2>
            <p style="text-align: center; font-size: 1.1rem; background: none; border: none; color: #f8fafc;">
                פתרתם בהצלחה גשו לתחנה הבאה
            </p>
            <button onclick="location.reload()">שחק שוב</button>
        </div>
    </div>

    <script>
        const cols = 4;
        const rows = 3;
        const totalPieces = cols * rows;
        let board = [];
        let selectedIndex = null;
        let moves = 0;
        let lockedForRiddle = false;
        let currentRiddleIndex = 0;
        let wrongAttempts = 0;
        let lockTimeout = null;

        // רשימת 6 השאלות/חידות
        const riddles = [
            {
                title: "חידה מספר 1 - פענוח אקרוסטיכון",
                htmlContent: `
                    אי שם, ביער הקסום, התגורר לו שדון קטן<br>
                    גבוהי העצים הסתירו טירה עתיקה, שבה חיו פיות לאור הירח.<br>
                    הרחק מעבר לנחל הכסף, נצנץ מפתח מוזהב בין הפרחים.<br>
                    <span class="highlight-riddle-text">זקני היער לחשו אגדה עתיקה, שרק חניכים שאוהבים גיאומטריה אבל שונאים את האותיות א' ו' יכלו להבין</span>
                `,
                answer: "1357"
            },
            {
                title: "חידה מספר 2",
                htmlContent: `<p>כאן תופיע השאלה השנייה (עדכן בהמשך לפי הצורך). מה הסיסמה?</p>`,
                answer: "תשובה2"
            },
            {
                title: "חידה מספר 3",
                htmlContent: `<p>כאן תופיע השאלה השלישית (עדכן בהמשך לפי הצורך). מה הסיסמה?</p>`,
                answer: "תשובה3"
            },
            {
                title: "חידה מספר 4",
                htmlContent: `<p>כאן תופיע השאלה הרביעית (עדכן בהמשך לפי הצורך). מה הסיסמה?</p>`,
                answer: "תשובה4"
            },
            {
                title: "חידה מספר 5",
                htmlContent: `<p>כאן תופיע השאלה החמישית (עדכן בהמשך לפי הצורך). מה הסיסמה?</p>`,
                answer: "תשובה5"
            },
            {
                title: "חידה מספר 6",
                htmlContent: `<p>כאן תופיע השאלה השישית והאחרונה (עדכן בהמשך לפי הצורך). מה הסיסמה?</p>`,
                answer: "תשובה6"
            }
        ];

        const boardElement = document.getElementById('puzzle-board');
        const movesElement = document.getElementById('moves-count');
        const solvedRiddlesElement = document.getElementById('riddles-solved');

        function initGame() {
            board = Array.from({length: totalPieces}, (_, i) => i);
            shufflePuzzle();
        }

        function shufflePuzzle() {
            do {
                for (let i = board.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [board[i], board[j]] = [board[j], board[i]];
                }
            } while (isSolved());

            moves = 0;
            currentRiddleIndex = 0;
            wrongAttempts = 0;
            lockedForRiddle = false;
            movesElement.textContent = moves;
            solvedRiddlesElement.textContent = currentRiddleIndex;
            selectedIndex = null;
            boardElement.classList.remove('locked');
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            board.forEach((pieceIndex, currentPos) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                if (currentPos === selectedIndex) {
                    piece.classList.add('selected');
                }

                const x = cols > 1 ? (pieceIndex % cols) * (100 / (cols - 1)) : 0;
                const y = rows > 1 ? Math.floor(pieceIndex / cols) * (100 / (rows - 1)) : 0;
                piece.style.backgroundPosition = `${x}% ${y}%`;

                piece.addEventListener('click', () => {
                    if (!lockedForRiddle) handlePieceClick(currentPos);
                });
                boardElement.appendChild(piece);
            });
        }

        function handlePieceClick(pos) {
            if (selectedIndex === null) {
                selectedIndex = pos;
            } else if (selectedIndex === pos) {
                selectedIndex = null;
            } else {
                [board[selectedIndex], board[pos]] = [board[pos], board[selectedIndex]];
                selectedIndex = null;
                moves++;
                movesElement.textContent = moves;

                renderBoard();

                // כל 2 צעדים (ובתנאי שיש עוד חידות פתוחות) - ננעול ונשגר שאלה
                if (moves % 2 === 0 && currentRiddleIndex < riddles.length && !isSolved()) {
                    triggerRiddle();
                }

                if (isSolved() && currentRiddleIndex >= riddles.length) {
                    document.getElementById('win-modal').style.display = 'flex';
                }
            }
            renderBoard();
        }

        function triggerRiddle() {
            lockedForRiddle = true;
            boardElement.classList.add('locked');
            
            const riddle = riddles[currentRiddleIndex];
            document.getElementById('riddle-title').textContent = riddle.title;
            document.getElementById('riddle-content-box').innerHTML = `<p>${riddle.htmlContent}</p>`;
            document.getElementById('riddle-answer').value = '';
            document.getElementById('riddle-error').textContent = '';
            document.getElementById('riddle-modal').style.display = 'flex';
        }

        function checkRiddleAnswer() {
            if (lockTimeout) return; // אם יש השהיה פעילה

            const userAns = document.getElementById('riddle-answer').value.trim();
            const correctAnswer = riddles[currentRiddleIndex].answer;

            if (userAns === correctAnswer) {
                // תשובה נכונה
                document.getElementById('riddle-modal').style.display = 'none';
                boardElement.classList.remove('locked');
                lockedForRiddle = false;
                currentRiddleIndex++;
                wrongAttempts = 0;
                solvedRiddlesElement.textContent = currentRiddleIndex;

                if (isSolved() && currentRiddleIndex >= riddles.length) {
                    document.getElementById('win-modal').style.display = 'flex';
                }
            } else {
                // תשובה שגויה
                wrongAttempts++;
                if (wrongAttempts >= 3) {
                    startPenaltyTimer();
                } else {
                    document.getElementById('riddle-error').textContent = `תשובה שגויה! נותרו לך עוד ${3 - wrongAttempts} ניסיונות.`;
                }
            }
        }

        function startPenaltyTimer() {
            let timeLeft = 21;
            const errorDiv = document.getElementById('riddle-error');
            const inputField = document.getElementById('riddle-answer');
            inputField.disabled = true;

            lockTimeout = setInterval(() => {
                errorDiv.textContent = `טעית 3 פעמים! מעניין למה 21😉 נעול למשך ${timeLeft} שניות...`;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(lockTimeout);
                    lockTimeout = null;
                    wrongAttempts = 0;
                    inputField.disabled = false;
                    errorDiv.textContent = "";
                }
            }, 1000);
        }

        function isSolved() {
            return board.every((val, idx) => val === idx);
        }

        function togglePreview() {
            const box = document.getElementById('preview-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        initGame();
    </script>
</body>
</html>
