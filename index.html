<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאזל תחנה - המשחק</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .game-info {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .game-info span {
            font-weight: bold;
            color: #818cf8;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 100%;
        }

        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 85vw;
            max-width: 360px;
            aspect-ratio: 3 / 4;
            gap: 3px;
            background: #334155;
            padding: 4px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border-color);
            position: relative;
        }

        #puzzle-board.locked::after {
            content: '🔒 הפאזל נעול! פתור את החידה';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f43f5e;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            z-index: 50;
            text-align: center;
            padding: 10px;
        }

        .puzzle-piece {
            background-image: url('Screenshot_20261010_171342_Instagram.jpg');
            background-size: 400% 300%;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        .puzzle-piece:hover {
            transform: scale(1.03);
            z-index: 10;
        }

        .puzzle-piece.selected {
            border: 2px solid #f43f5e;
            box-shadow: 0 0 15px #f43f5e;
            z-index: 20;
            transform: scale(0.96);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-card h2 {
            margin-top: 0;
            color: #818cf8;
            font-size: 1.3rem;
        }

        .riddle-text-box {
            line-height: 1.6;
            font-size: 0.95rem;
            color: #cbd5e1;
            text-align: right;
            background: #0f172a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .highlight-riddle-text {
            display: block;
            margin-top: 10px;
            padding: 8px;
            background: rgba(129, 140, 248, 0.1);
            border-right: 4px solid #818cf8;
            color: #f8fafc;
            font-weight: bold;
            font-size: 1rem;
            line-height: 1.5;
        }

        .modal-card input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .error-msg {
            color: #f43f5e;
            font-size: 0.85rem;
            margin-top: 5px;
            min-height: 20px;
        }

        .preview-toggle {
            font-size: 0.85rem;
            color: #94a3b8;
            background: none;
            border: 1px dashed var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>פאזל תחנה</h1>
    
    <div class="game-info">
        <div>צעדים: <span id="moves-count">0</span></div>
        <div>חידות/משימות: <span id="riddles-solved">0</span> / 3</div>
    </div>

    <div class="main-container">
        <div id="puzzle-board"></div>

        <div class="controls">
            <button onclick="shufflePuzzle()">ערבב מחדש</button>
        </div>

        <div style="text-align: center;">
            <button class="preview-toggle" onclick="togglePreview()">הצג/הסתר תמונה מלאה</button>
            <div id="preview-box" style="display:none; margin-top:8px;">
                <img src="Screenshot_20261010_171342_Instagram.jpg" alt="תמונה מלאה" style="max-width:160px; border-radius:8px; border:1px solid var(--border-color);">
            </div>
        </div>
    </div>

    <!-- פופאפ חידות -->
    <div id="riddle-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="riddle-title">חידה נעולה!</h2>
            <div id="riddle-content-box" class="riddle-text-box"></div>
            <input type="text" id="riddle-answer" placeholder="הכנס את התשובה כאן...">
            <button onclick="checkRiddleAnswer()">שלח תשובה</button>
            <div id="riddle-error" class="error-msg"></div>
        </div>
    </div>

    <!-- פופאפ סיום ניצחון -->
    <div id="win-modal" class="modal-overlay">
        <div class="modal-card" style="border-color: #4ade80; padding: 40px 20px;">
            <h2 style="color: #4ade80; font-size: 2.2rem; margin: 0; margin-bottom: 15px;">🎉 כל הכבוד! 🎉</h2>
            <p style="text-align: center; font-size: 1.5rem; font-weight: bold; background: none; border: none; color: #f8fafc; padding: 0; margin: 0;">
                גשו לתחנה הבאה
            </p>
        </div>
    </div>

    <script>
        const cols = 4;
        const rows = 3;
        const totalPieces = cols * rows;
        let board = [];
        let selectedIndex = null;
        let moves = 0;
        
        let lockedForRiddle = false;
        let activeRiddleIndex = -1;
        let riddlesSolved = 0; 
        let wrongAttempts = 0;
        let lockTimeout = null;

        const riddles = [
            {
                title: "חידה 1 - פענוח אקרוסטיכון",
                htmlContent: `
                    אי שם, ביער הקסום, התגורר לו שדון קטן<br>
                    גבוהי העצים הסתירו טירה עתיקה, שבה חיו פיות לאור הירח.<br>
                    הרחק מעבר לנחל הכסף, נצנץ מפתח מוזהב בין הפרחים.<br>
                    <span class="highlight-riddle-text">זקני היער לחשו אגדה עתיקה, שרק חניכים שאוהבים גיאומטריה אבל שונאים את האותיות א' ו' יכלו להבין</span>
                `,
                answer: "1357"
            },
            {
                title: "משימה 2",
                htmlContent: `גשו לשגיא ותגידו 3 4 ו ותעשו את סימן ההיכר שלו 🤨🤨<br>לאחר שביצעתם את המשימה גשו לנועם לקבלת קוד הפתרון.`,
                answer: "22"
            },
            {
                title: "חידה 3 - אתגר לוגיקה",
                htmlContent: `
                    <p>מה הפתרון?</p>
                    <ul style="padding-right: 20px; text-align: right;">
                        <li>9 זה מספר יפה אבל אני אוהב גיאומטריה</li>
                        <li>לרוץ אבל באנגלית</li>
                        <li>לא נועה קירל! אנה __</li>
                        <li>רעל שיש ממנו כמות מזערית בתפוחים אבל בלי הניד</li>
                    </ul>
                    <p style="font-weight: bold; color: #f8fafc; text-align: center;">ואל תשכחו ששגיא נגמר בא' אבל הוא מאמין ב ה'</p>
                `,
                answer: "טרנזקציה"
            }
        ];

        const boardElement = document.getElementById('puzzle-board');
        const movesElement = document.getElementById('moves-count');
        const solvedRiddlesElement = document.getElementById('riddles-solved');

        function initGame() {
            board = Array.from({length: totalPieces}, (_, i) => i);
            shufflePuzzle();
        }

        function shufflePuzzle() {
            do {
                for (let i = board.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [board[i], board[j]] = [board[j], board[i]];
                }
            } while (getCorrectPiecesCount() > 0);

            moves = 0;
            riddlesSolved = 0;
            activeRiddleIndex = -1;
            wrongAttempts = 0;
            lockedForRiddle = false;
            
            movesElement.textContent = moves;
            solvedRiddlesElement.textContent = "0";
            
            selectedIndex = null;
            boardElement.classList.remove('locked');
            renderBoard();
        }

        function getCorrectPiecesCount() {
            let count = 0;
            for (let i = 0; i < board.length; i++) {
                if (board[i] === i) count++;
            }
            return count;
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            board.forEach((pieceIndex, currentPos) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                
                if (currentPos === selectedIndex) {
                    piece.classList.add('selected');
                }

                const x = cols > 1 ? (pieceIndex % cols) * (100 / (cols - 1)) : 0;
                const y = rows > 1 ? Math.floor(pieceIndex / cols) * (100 / (rows - 1)) : 0;
                piece.style.backgroundPosition = `${x}% ${y}%`;

                piece.addEventListener('click', () => {
                    handlePieceClick(currentPos);
                });
                
                boardElement.appendChild(piece);
            });
        }

        function handlePieceClick(pos) {
            if (lockedForRiddle) return;

            if (selectedIndex === null) {
                selectedIndex = pos;
                renderBoard();
            } else if (selectedIndex === pos) {
                selectedIndex = null;
                renderBoard();
            } else {
                [board[selectedIndex], board[pos]] = [board[pos], board[selectedIndex]];
                selectedIndex = null;
                moves++;
                movesElement.textContent = moves;
                
                renderBoard(); 
                checkGameState();
            }
        }

        function checkGameState() {
            // חידה 1 אחרי 2 הזזות
            if (moves >= 2 && riddlesSolved === 0) {
                activeRiddleIndex = 0;
                setTimeout(triggerRiddle, 300);
                return;
            }
            // משימה 2 אחרי 4 הזזות
            if (moves >= 4 && riddlesSolved === 1) {
                activeRiddleIndex = 1;
                setTimeout(triggerRiddle, 300);
                return;
            }
            // חידה 3 אחרי 6 הזזות
            if (moves >= 6 && riddlesSolved === 2) {
                activeRiddleIndex = 2;
                setTimeout(triggerRiddle, 300);
                return;
            }

            // רק אם הפאזל סודר בשלמותו וגם כל 3 החידות נפתרו - הצג מסך ניצחון
            if (getCorrectPiecesCount() === totalPieces && riddlesSolved === 3) {
                setTimeout(() => {
                    document.getElementById('win-modal').style.display = 'flex';
                }, 400);
            }
        }

        function triggerRiddle() {
            lockedForRiddle = true;
            boardElement.classList.add('locked');
            
            const riddle = riddles[activeRiddleIndex];
            document.getElementById('riddle-title').textContent = riddle.title;
            document.getElementById('riddle-content-box').innerHTML = riddle.htmlContent;
            document.getElementById('riddle-answer').value = '';
            document.getElementById('riddle-error').textContent = '';
            document.getElementById('riddle-modal').style.display = 'flex';
        }

        function checkRiddleAnswer() {
            if (lockTimeout) return;

            const userAns = document.getElementById('riddle-answer').value.trim();
            const correctAnswer = riddles[activeRiddleIndex].answer;

            if (userAns === correctAnswer) {
                document.getElementById('riddle-modal').style.display = 'none';
                boardElement.classList.remove('locked');
                lockedForRiddle = false;
                
                riddlesSolved++;
                solvedRiddlesElement.textContent = riddlesSolved;
                wrongAttempts = 0;

                setTimeout(checkGameState, 150);
            } else {
                wrongAttempts++;
                if (wrongAttempts >= 3) {
                    startPenaltyTimer();
                } else {
                    document.getElementById('riddle-error').textContent = `תשובה שגויה! נותרו לך עוד ${3 - wrongAttempts} ניסיונות.`;
                }
            }
        }

        function startPenaltyTimer() {
            let timeLeft = 12;
            const errorDiv = document.getElementById('riddle-error');
            const inputField = document.getElementById('riddle-answer');
            inputField.disabled = true;

            lockTimeout = setInterval(() => {
                errorDiv.textContent = `טעית 3 פעמים! מעניין למה 12😉 נעול למשך ${timeLeft} שניות...`;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(lockTimeout);
                    lockTimeout = null;
                    wrongAttempts = 0;
                    inputField.disabled = false;
                    errorDiv.textContent = "";
                }
            }, 1000);
        }

        function togglePreview() {
            const box = document.getElementById('preview-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        initGame();
    </script>
</body>
</html>
