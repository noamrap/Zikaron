<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאזל תחנה - המשחק</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .game-info {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .game-info span {
            font-weight: bold;
            color: #818cf8;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 100%;
        }

        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 85vw;
            max-width: 360px;
            aspect-ratio: 3 / 4;
            gap: 3px;
            background: #334155;
            padding: 4px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--border-color);
            position: relative;
        }

        #puzzle-board.locked::after {
            content: '🔒 הפאזל נעול! פתור את החידה';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f43f5e;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 10px;
            z-index: 50;
            text-align: center;
            padding: 10px;
        }

        .puzzle-piece {
            background-image: url('Screenshot_20261010_171342_Instagram.jpg');
            background-size: 400% 300%;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        .puzzle-piece:hover {
            transform: scale(1.03);
            z-index: 10;
        }

        .puzzle-piece.selected {
            border: 2px solid #f43f5e;
            box-shadow: 0 0 15px #f43f5e;
            z-index: 20;
            transform: scale(0.96);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-card h2 {
            margin-top: 0;
            color: #818cf8;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .riddle-text-box {
            line-height: 1.8;
            font-size: 0.95rem;
            color: #cbd5e1;
            text-align: right;
            background: #0f172a;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        
        .riddle-text-box ul {
            margin: 10px 0;
            padding-right: 20px;
        }

        .riddle-text-box li {
            margin-bottom: 8px;
        }

        .riddle-box-highlight {
            margin-top: 12px;
            padding: 12px 14px;
            background: rgba(99, 102, 241, 0.15);
            border: 2px solid #818cf8;
            border-radius: 8px;
            color: #f8fafc;
            text-align: right;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .google-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            box-shadow: none;
        }

        .google-icon-btn:hover {
            opacity: 0.8;
            transform: scale(1.1);
        }

        .modal-card input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .error-msg {
            color: #f43f5e;
            font-size: 0.85rem;
            margin-top: 5px;
            min-height: 20px;
        }

        .preview-toggle {
            font-size: 0.85rem;
            color: #94a3b8;
            background: none;
            border: 1px dashed var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>פאזל תחנה</h1>
    
    <div class="game-info">
        <div>צעדים: <span id="moves-count">0</span></div>
        <div>חידות/משימות: <span id="riddles-solved">0</span> / 3</div>
    </div>

    <div class="main-container">
        <div id="puzzle-board" dir="ltr"></div>

        <div class="controls">
            <button onclick="shufflePuzzle()">ערבב מחדש</button>
            <button id="check-btn" onclick="checkPuzzleHint()" style="display: none; background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);">בדוק אילו חלקים נכונים</button>
        </div>

        <div style="text-align: center;">
            <button class="preview-toggle" onclick="togglePreview()">הצג/הסתר תמונה מלאה</button>
            <div id="preview-box" style="display:none; margin-top:8px;">
                <img src="Screenshot_20261010_171342_Instagram.jpg" alt="תמונה מלאה" style="max-width:160px; border-radius:8px; border:1px solid var(--border-color);">
            </div>
        </div>
    </div>

    <!-- פופאפ חידות -->
    <div id="riddle-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="riddle-title">חידה נעולה!</h2>
            <div id="riddle-content-box" class="riddle-text-box"></div>
            <input type="text" id="riddle-answer" placeholder="הכנס את התשובה כאן...">
            <button onclick="checkRiddleAnswer()">שלח תשובה</button>
            <div id="riddle-error" class="error-msg"></div>
        </div>
    </div>

    <!-- פופאפ סיום ניצחון -->
    <div id="win-modal" class="modal-overlay">
        <div class="modal-card" style="border-color: #4ade80; padding: 40px 20px;">
            <h2 style="color: #4ade80; font-size: 2.2rem; margin: 0; margin-bottom: 20px;">מעולה!</h2>
            <p style="text-align: center; font-size: 1.4rem; font-weight: bold; background: none; border: none; color: #f8fafc; padding: 0; margin: 0; line-height: 1.5;">
                גשו לתחנה הבאה ואל תשכחו את הפתרון של חידה 1<br><br>משוחרר משוחררים
            </p>
        </div>
    </div>

    <script>
        const cols = 4;
        const rows = 3;
        const totalPieces = cols * rows;
        let board = [];
        let selectedIndex = null;
        let moves = 0;
        
        let lockedForRiddle = false;
        let activeRiddleIndex = -1;
        let riddlesSolved = 0; 
        let wrongAttempts = 0;
        let lockTimeout = null;

        const riddles = [
            {
                title: 'חידה 1 - פענוח אקרוסטיכון <a href="https://www.google.com" target="_blank" title="חפש בגוגל" class="google-icon-btn"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.14v3.15C3.16 21.31 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.14C.41 8.08 0 9.75 0 12s.41 3.92 1.14 5.4l4.14-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.16 2.69 1.14 6.6l4.14 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg></a>',
                htmlContent: `
                    אי שם, ביער הקסום, התגורר לו שדון קטן<br>
                    גבוהי העצים הסתירו טירה עתיקה, שבה חיו פיות לאור הירח.<br>
                    הרחק מעבר לנחל הכסף, נצנץ מפתח מוזהב בין הפרחים.<br>
                    זקני היער לחשו אגדה עתיקה<br>
                    <div class="riddle-box-highlight"><b>שרק חניכים שאוהבים גיאומטריה אבל שונאים את האותיות א' ו' יכלו להבין</b></div>
                `,
                answer: "1357"
            },
            {
                title: "משימה 2",
                htmlContent: `גשו לשגיא ובו זמנית תעשו את סימן ההיכר שלו 🤨🤨<br>לאחר שביצעתם את המשימה גשו לנועם לקבלת קוד הפתרון.`,
                answer: "67"
            },
            {
                title: "חידה 3 - אתגר לוגיקה",
                htmlContent: `
                    <p>מה הפתרון?</p>
                    <ul style="padding-right: 20px; text-align: right; direction: rtl;">
                        <li>9 זה מספר יפה אבל אני אוהב גיאומטריה</li>
                        <li>לרוץ אבל באנגלית</li>
                        <li>
                            <div id="access-container" style="display:inline-block;">
                                <button type="button" id="ask-key-btn" onclick="toggleAccessInput()" style="background: #334155; font-size: 0.85rem; padding: 4px 10px; cursor: pointer;">מה האקסס קי?</button>
                                <div id="key-input-area" style="display: none; margin-top: 6px;">
                                    <input type="text" id="access-key-input" placeholder="הכנס אקסס קי..." style="margin-bottom: 4px; padding: 5px; font-size: 0.85rem; width: 70%;">
                                    <button type="button" onclick="checkAccessKey()" style="background: #6366f1; font-size: 0.8rem; padding: 5px 10px; cursor: pointer;">אישור</button>
                                    <div id="key-error" style="color: #f43f5e; font-size: 0.75rem; margin-top: 2px;"></div>
                                </div>
                            </div>
                            <span id="secret-clue" style="display: none; color: #818cf8; font-weight: bold;">לא נועה קירל! אנה __</span>
                        </li>
                        <li>רעל שיש ממנו כמות מזערית בתפוחים אבל בלי הניד</li>
                    </ul>
                    
                    <!-- חיבור ויזואלי ברור לרמז של הציאניד -->
                    <div style="margin-top: 15px; padding: 10px 12px; background: rgba(129, 140, 248, 0.12); border-right: 4px solid #818cf8; border-radius: 6px; text-align: right;">
                        <div style="font-size: 0.8rem; color: #a5b4fc; margin-bottom: 4px; display: flex; align-items: center; gap: 5px;">
                            <span>⬇️ רמז קשור למשפט הרעי (ציאניד) שמעל:</span>
                        </div>
                        <p style="font-weight: bold; color: #f8fafc; text-align: center; direction: rtl; margin: 0; font-size: 0.95rem;">
                            ואל תשכחו ששגיא נגמר א' אבל הוא מאמין ב ה'
                        </p>
                    </div>
                `,
                answer: "טרנזקציה"
            }
        ];

        const boardElement = document.getElementById('puzzle-board');
        const movesElement = document.getElementById('moves-count');
        const solvedRiddlesElement = document.getElementById('riddles-solved');

        function initGame() {
            board = Array.from({length: totalPieces}, (_, i) => i);
            shufflePuzzle();
        }

        function toggleAccessInput() {
            const area = document.getElementById('key-input-area');
            const btn = document.getElementById('ask-key-btn');
            if (area) {
                area.style.display = 'block';
                if (btn) btn.style.display = 'none';
            }
        }

        function checkAccessKey() {
            const inputVal = document.getElementById('access-key-input').value.trim();
            const errorDiv = document.getElementById('key-error');
            if (inputVal === "12345654321") {
                const secret = document.getElementById('secret-clue');
                const container = document.getElementById('access-container');
                if (secret) secret.style.display = 'inline';
                if (container) container.style.display = 'none';
            } else {
                if (errorDiv) errorDiv.textContent = "אקסס קי שגוי!";
            }
        }

        function shufflePuzzle() {
            do {
                for (let i = board.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [board[i], board[j]] = [board[j], board[i]];
                }
            } while (getCorrectPiecesCount() > 0);

            moves = 0;
            riddlesSolved = 0;
            activeRiddleIndex = -1;
            wrongAttempts = 0;
            lockedForRiddle = false;
            
            movesElement.textContent = moves;
            solvedRiddlesElement.textContent = "0";
            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('win-modal').style.display = 'none';
            
            selectedIndex = null;
            boardElement.classList.remove('locked');
            renderBoard();
        }

        function getCorrectPiecesCount() {
            let count = 0;
            for (let i = 0; i < board.length; i++) {
                if (board[i] === i) count++;
            }
            return count;
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            board.forEach((pieceIndex, currentPos) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                
                if (currentPos === selectedIndex) {
                    piece.classList.add('selected');
                }

                const x = cols > 1 ? (pieceIndex % cols) * (100 / (cols - 1)) : 0;
                const y = rows > 1 ? Math.floor(pieceIndex / cols) * (100 / (rows - 1)) : 0;
                piece.style.backgroundPosition = `${x}% ${y}%`;

                piece.addEventListener('click', () => {
                    handlePieceClick(currentPos);
                });
                
                boardElement.appendChild(piece);
            });
        }

        function handlePieceClick(pos) {
            if (lockedForRiddle) return;

            if (selectedIndex === null) {
                selectedIndex = pos;
                renderBoard();
            } else if (selectedIndex === pos) {
                selectedIndex = null;
                renderBoard();
            } else {
                [board[selectedIndex], board[pos]] = [board[pos], board[selectedIndex]];
                selectedIndex = null;
                moves++;
                movesElement.textContent = moves;
                
                renderBoard(); 
                checkGameState();
            }
        }

        function checkGameState() {
            if (moves >= 2 && riddlesSolved === 0) {
                activeRiddleIndex = 0;
                setTimeout(triggerRiddle, 300);
                return;
            }
            if (moves >= 4 && riddlesSolved === 1) {
                activeRiddleIndex = 1;
                setTimeout(triggerRiddle, 300);
                return;
            }
            if (moves >= 6 && riddlesSolved === 2) {
                activeRiddleIndex = 2;
                setTimeout(triggerRiddle, 300);
                return;
            }

            if (riddlesSolved === 3) {
                document.getElementById('check-btn').style.display = 'inline-block';
            }

            if (getCorrectPiecesCount() === totalPieces && riddlesSolved === 3) {
                setTimeout(() => {
                    document.getElementById('win-modal').style.display = 'flex';
                }, 400);
            }
        }

        function triggerRiddle() {
            lockedForRiddle = true;
            boardElement.classList.add('locked');
            
            const riddle = riddles[activeRiddleIndex];
            document.getElementById('riddle-title').innerHTML = riddle.title;
            document.getElementById('riddle-content-box').innerHTML = riddle.htmlContent;
            document.getElementById('riddle-answer').value = '';
            document.getElementById('riddle-error').textContent = '';
            document.getElementById('riddle-modal').style.display = 'flex';
        }

        function checkRiddleAnswer() {
            if (lockTimeout) return;

            const userAns = document.getElementById('riddle-answer').value.trim();
            const correctAnswer = riddles[activeRiddleIndex].answer;

            if (userAns === correctAnswer) {
                document.getElementById('riddle-modal').style.display = 'none';
                boardElement.classList.remove('locked');
                lockedForRiddle = false;
                
                riddlesSolved++;
                solvedRiddlesElement.textContent = riddlesSolved;
                wrongAttempts = 0;

                setTimeout(checkGameState, 150);
            } else {
                wrongAttempts++;
                if (wrongAttempts >= 3) {
                    startPenaltyTimer();
                } else {
                    document.getElementById('riddle-error').textContent = `תשובה שגויה! נותרו לך עוד ${3 - wrongAttempts} ניסיונות.`;
                }
            }
        }

        function startPenaltyTimer() {
            let timeLeft = 12;
            const errorDiv = document.getElementById('riddle-error');
            const inputField = document.getElementById('riddle-answer');
            inputField.disabled = true;

            lockTimeout = setInterval(() => {
                errorDiv.textContent = `טעית 3 פעמים! מעניין למה 12😉 נעול למשך ${timeLeft} שניות...`;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(lockTimeout);
                    lockTimeout = null;
                    wrongAttempts = 0;
                    inputField.disabled = false;
                    errorDiv.textContent = "";
                }
            }, 1000);
        }

        function togglePreview() {
            const box = document.getElementById('preview-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        function checkPuzzleHint() {
            const pieces = document.querySelectorAll('.puzzle-piece');
            board.forEach((pieceIndex, currentPos) => {
                if (pieceIndex === currentPos) {
                    pieces[currentPos].style.boxShadow = "inset 0 0 0 4px #4ade80"; 
                } else {
                    pieces[currentPos].style.boxShadow = "inset 0 0 0 4px #f43f5e";
                }
                setTimeout(() => {
                    pieces[currentPos].style.boxShadow = "";
                }, 2500);
            });
        }

        setInterval(() => {
            if (getCorrectPiecesCount() === totalPieces && riddlesSolved === 3) {
                document.getElementById('win-modal').style.display = 'flex';
            }
        }, 1000);

        initGame();
    </script>
</body>
</html>
